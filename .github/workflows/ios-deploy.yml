name: iOS Deploy

# OPTIONAL / lower-confidence. Mirrors Android telly's android-deploy.yml
# (workflow_run after CI succeeds on main) + /new-ionic-app's ios-deploy.yml,
# adapted to archive the universal SwiftUI app and upload to TestFlight via the
# App Store Connect API.
#
# PREREQUISITES (one-time, per /new-ionic-app §13 — mostly already done since the
# app is already on TestFlight):
#   * Repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT (.p8 contents),
#     TEAM_ID (JW5SC3NYUV).
#   * App record + bundle id com.johncorser.telly already exist in App Store Connect.
#   * DEVELOPMENT_TEAM is set in project.yml (JW5SC3NYUV) and
#     ITSAppUsesNonExemptEncryption = NO is declared (both already true).
#
# NOTE: GitHub Actions credits may be exhausted (as on Android telly). Ship this
# only if automated TestFlight uploads are wanted; otherwise keep just ci.yml.
#
# TRIGGER: manual (workflow_dispatch) ONLY — this is intentionally NOT wired to
# push / workflow_run so it can never fail spuriously when the ASC secrets are
# absent. Run it by hand from the Actions tab once the secrets below are set.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   * ASC_KEY_ID      — App Store Connect API key id
#   * ASC_ISSUER_ID   — App Store Connect API issuer id
#   * ASC_KEY_CONTENT — the .p8 private-key file contents
#   * TEAM_ID         — Apple Developer team id (JW5SC3NYUV)

on:
  workflow_dispatch:

env:
  SCHEME: Telly

jobs:
  testflight:
    name: Upload to TestFlight
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4


      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_CONTENT" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Archive + upload once per platform (single universal target, two SDKs).
      - name: Unlock CI signing keychain
        env:
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/ci-signing.keychain-db"

      - name: Archive & upload (iOS)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Runner jobs run in the system launchd context: sign manually from the CI keychain
          # (see ~/ci-signing/ios_manual_signing.py).
          python3 ~/ci-signing/ios_manual_signing.py apply Telly.xcodeproj --platform ios \
            --destination export --export-options /tmp/ExportOptions-ios.plist
          xcodebuild -scheme "$SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Telly-iOS.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/Telly-iOS.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions-ios.plist \
            -exportPath build/export-iOS \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f build/export-iOS/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          python3 ~/ci-signing/ios_manual_signing.py revert Telly.xcodeproj

      - name: Archive & upload (tvOS)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Runner jobs run in the system launchd context: sign manually from the CI keychain
          # (see ~/ci-signing/ios_manual_signing.py).
          python3 ~/ci-signing/ios_manual_signing.py apply Telly.xcodeproj --platform tvos \
            --destination export --export-options /tmp/ExportOptions-tvos.plist
          xcodebuild -scheme "$SCHEME" \
            -sdk appletvos \
            -destination "generic/platform=tvOS" \
            -archivePath build/Telly-tvOS.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/Telly-tvOS.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions-tvos.plist \
            -exportPath build/export-tvOS \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f build/export-tvOS/*.ipa -t tvos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Revert CI signing
        if: always()
        run: python3 ~/ci-signing/ios_manual_signing.py revert Telly.xcodeproj

# You also need .github/exportOptions.plist committed, e.g.:
#   <plist version="1.0"><dict>
#     <key>method</key><string>app-store-connect</string>
#     <key>teamID</key><string>JW5SC3NYUV</string>
#     <key>uploadSymbols</key><true/>
#   </dict></plist>
