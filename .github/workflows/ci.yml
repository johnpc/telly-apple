name: CI

# Mirrors the Android telly CI (build + test + static analysis) adapted for a
# native SwiftUI, xcodegen-managed project on a macOS runner. Runs the SAME gates
# as scripts/quality.sh so the Python quality gates run in CI too.
#
# RELIABILITY RULE: there is no such thing as a flaky test. Every step must pass
# on every run; an intermittent failure is a defect in the test or the code and
# is fixed at the root (deterministic seams, no shared state, no real network),
# never retried, re-run or quarantined. See AGENTS.md.
#
# NOTES / CAVEATS:
#  * Runner: macos-26 with Xcode 26.x (deploymentTarget iOS 18 / tvOS 18; the
#    quality gate targets iOS 26 / tvOS 26.5 simulators).
#  * SPM/VLCKit: main uses VLCKitSPM 3.6.0 (prebuilt XCFramework, resolves cleanly
#    from GitHub) — CI is fine. The VLCKit-4 alpha big-download caveat applies ONLY
#    to the experimental spike branch, not main.
#  * Simulator names below may need to match whatever ships on the macos-26 image;
#    the "List simulators" step prints what's available. Override via the env vars.
#  * GitHub Actions credits may be exhausted (as on Android telly) — this workflow
#    exists for repo-completeness parity; the authoritative gate is local
#    ./scripts/quality.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SCHEME: Telly
  # Destinations are Telly's OWN simulator devices, resolved per step by
  # scripts/simulators.sh (shared stock devices get hijacked by other repos' jobs).

jobs:
  quality:
    name: Quality gates
    # Self-hosted Mac Mini. This job also runs on pull_request, and
    # self-hosted runners on a public repo are unsafe for fork PRs
    # (arbitrary code execution) -- so only run for push-to-main or a PR
    # authored by the repo owner. Other PRs simply skip this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'johnpc'
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Self-hosted Mac Mini has a single Xcode install (27.2), already
      # selected via xcode-select -- no need to pick among multiple
      # versions like GitHub-hosted runners provide.

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List simulators (debug aid for destination names)
        run: xcrun simctl list devicetypes runtimes devices available

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -derivedDataPath DerivedData

      # ---- Static gates (same as quality.sh phases 1-3) ----
      - name: Source file line limit (<=100)
        run: bash scripts/check_source_lines.sh

      - name: Acceptance tests in sync with .feature files
        run: python3 scripts/generate_acceptance_tests.py --check

      - name: Dead code
        run: python3 scripts/dead_code_check.py

      - name: Duplication
        run: python3 scripts/duplication_check.py

      - name: Banned types
        run: python3 scripts/banned_types_check.py

      - name: Halstead (D <= 20)
        run: python3 scripts/halstead_check.py

      # ---- Tests + coverage (quality.sh phases 4-5) ----
      - name: Unit tests + coverage (iOS)
        run: |
          rm -rf TestResults.xcresult
          source scripts/simulators.sh
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$(telly_destination ios)" \
            -only-testing:TellyTests \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      # Gherkin acceptance scenarios (TellyUITests) run against the in-process
      # demo provider (DemoContent) with -tellyResetState per scenario: no
      # server, no network, no shared state — so they pass on every run. A
      # test that fails intermittently is a bug to fix, never a retry.
      - name: Acceptance tests (iOS)
        run: |
          # The mini hosts several repos' runners: wait (max 15 min) until no other
          # simulator-heavy xcodebuild test job is running and the load is sane, or
          # CoreSimulator's services can die mid-run ("ipc/mig server died").
          WAITED=0
          while [ "$WAITED" -lt 900 ]; do
            OTHERS=$(pgrep -f "xcodebuild test" | wc -l | tr -d ' '); LOAD=$(sysctl -n vm.loadavg | awk '{print int($2)}')
            if [ "$OTHERS" -le 0 ] && [ "$LOAD" -lt 24 ]; then break; fi
            echo "waiting for a quiet simulator host (procs=$OTHERS load=$LOAD)"; sleep 30; WAITED=$((WAITED + 30))
          done
          # Boot + settle Telly's own device first: a fresh UI-test runner on a
          # still-booting simulator can hang its first AX query (see quality.sh).
          source scripts/simulators.sh
          TELLY_DESTINATION=$(telly_destination ios); telly_warm "$TELLY_DESTINATION"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$TELLY_DESTINATION" \
            -only-testing:TellyUITests \
            -derivedDataPath DerivedData

      - name: Acceptance tests (tvOS)
        run: |
          source scripts/simulators.sh
          TELLY_TVOS_DESTINATION=$(telly_destination tvos); telly_warm "$TELLY_TVOS_DESTINATION"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$TELLY_TVOS_DESTINATION" \
            -only-testing:TellyUITests \
            -derivedDataPath DerivedData

      - name: Coverage floor (>=80%) + CRAP (<=30)
        run: |
          python3 scripts/coverage_check.py coverage.json
          python3 scripts/crap_check.py coverage.json

      # ---- Builds (quality.sh phases 6-7) ----
      - name: Build app (iOS)
        run: |
          source scripts/simulators.sh
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$(telly_destination ios)" \
            -derivedDataPath DerivedData

      - name: Build app (tvOS)
        run: |
          source scripts/simulators.sh
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$(telly_destination tvos)" \
            -derivedDataPath DerivedData

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
