name: Telly
options:
  bundleIdPrefix: com.johncorser
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: JW5SC3NYUV
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "8"

packages:
  # gzip/xz EPG decompression (providers serve guide.xml.gz / .xz). Pure Swift,
  # one package for both codecs; used only by Telly/Epg/CompressedXmltv.swift.
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    from: "4.9.1"
  # SQLite persistence (mirrors the Android Room layer 1:1). An in-memory
  # DatabaseQueue is the unit-test backend, so no separate fake store is needed.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
  # VLCKit behind a protocol seam — IPTV serves raw MPEG-TS which AVPlayer
  # cannot decode, so the real PlayerEngine wraps libVLC. Prebuilt XCFramework
  # with iOS + tvOS slices; import as `VLCKitSPM`. App target only.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  Telly:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: Telly
    dependencies:
      - package: SWCompression
      - package: GRDB
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johncorser.telly
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Telly
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # App Store validation (90474) rejects iPad builds that don't declare all
        # four orientations for multitasking. iPhone stays portrait + landscape;
        # iPad ships all four. tvOS ignores these keys.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPhone(1) + iPad(2) + Apple TV(3). A single value must list every
        # family the app ships to, or xcodebuild filters out that platform's
        # destinations; each SDK ignores the families it doesn't recognise.
        TARGETED_DEVICE_FAMILY: "1,2,3"
        # iOS uses AppIcon.appiconset; tvOS requires a layered .brandassets, so
        # each SDK points at its own app-icon set (same asset catalog).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": TVAppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": TVAppIcon

  TellyTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: TellyTests
    dependencies:
      - target: Telly
      - package: SWCompression
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johncorser.telly.tests
        GENERATE_INFOPLIST_FILE: "YES"

  TellyUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS]
    sources:
      # .swift compile as sources; .feature files (unknown type) are bundled
      # as resources so AcceptanceTests can look them up at runtime.
      - path: TellyUITests
    dependencies:
      - target: Telly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johncorser.telly.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Telly:
    build:
      targets:
        Telly: all
    test:
      targets:
        - TellyTests
        - TellyUITests
      gatherCoverageData: true
      coverageTargets:
        - Telly
